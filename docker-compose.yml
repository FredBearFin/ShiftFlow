version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shiftflow-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - APP_ENV=${APP_ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SHIFTFLOW_SESSION_SECRET=${SHIFTFLOW_SESSION_SECRET:?Set SHIFTFLOW_SESSION_SECRET (32+ random characters) in the environment or .env}
      - SHIFTFLOW_ALLOW_SIGNUP=${SHIFTFLOW_ALLOW_SIGNUP:-true}
      - SHIFTFLOW_COOKIE_SECURE=${SHIFTFLOW_COOKIE_SECURE:-true}
      - SHIFTFLOW_CORS_ORIGINS=${SHIFTFLOW_CORS_ORIGINS:-http://localhost:5173}
      - SHIFTFLOW_DB_PATH=/app/data/shiftflow.db
    volumes:
      - shiftflow-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    container_name: shiftflow-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  shiftflow-data:
