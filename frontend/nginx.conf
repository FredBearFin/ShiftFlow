server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Baseline security headers for the pages this origin actually serves
    # (sign-in, sign-up, and the pricing-page checkout). Mirrors the backend's
    # SecurityHeadersMiddleware (see backend/app/middleware.py) so a page load
    # is protected the same way an API response is, in particular against a
    # malicious site framing the login/sign-up/checkout forms for clickjacking.
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 2m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
